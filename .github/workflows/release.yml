name: release

on:
  push:
    branches: [main]

concurrency:
  group: bumpy-release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  plan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: pnpm exec bumpy ci plan

  version-pr:
    if: needs.plan.outputs.mode == 'version-pr'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}

  publish:
    if: needs.plan.outputs.mode == 'publish'
    needs: plan
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run boundary:check
      - run: pnpm run check-types
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run package:smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned relay image
        id: relay
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/relay/package.json').version")
          image=ghcr.io/smashah/peardrop-relay
          docker build -f infra/relay/Dockerfile -t "$image:$version" .
          docker push "$image:$version"
          digest_ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version")
          test -n "$digest_ref"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"
      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest
      - run: pnpm exec bumpy ci release --expect-mode publish
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Verify npm packages
        env:
          VERSION: ${{ steps.relay.outputs.version }}
        run: |
          set -euo pipefail
          test "$(npm view "@peardrop/core@$VERSION" version)" = "$VERSION"
          test "$(npm view "@peardrop/cli@$VERSION" version)" = "$VERSION"
      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.relay.outputs.version }}
        run: gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -F -- "$VERSION"
      - name: Promote verified relay image
        env:
          DIGEST_REF: ${{ steps.relay.outputs.digest_ref }}
          IMAGE: ${{ steps.relay.outputs.image }}
          VERSION: ${{ steps.relay.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:latest" | grep -F -- "${DIGEST_REF#*@}"
          echo "Relay image: $DIGEST_REF" >> "$GITHUB_STEP_SUMMARY"
