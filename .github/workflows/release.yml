name: release

on:
  push:
    branches: [main]

concurrency:
  group: bumpy-release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  plan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: pnpm exec bumpy ci plan

  version-pr:
    if: needs.plan.outputs.mode == 'version-pr'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}

  # REVERTED 2026-08-10: this was briefly split into publish-auto (no
  # environment) / publish-major (environment: publish) to skip Mohammed's
  # approval click for minor/patch releases. Reverted within the hour —
  # npm's Trusted Publisher config for @peardrop/core and @peardrop/cli is
  # scoped to the GitHub Environment named "publish" specifically (see
  # docs/RELEASING.md's own trusted-publishing table), not just a human
  # approval gate: it's the OIDC trust boundary npm uses to authorize the
  # publish at all. A job that doesn't enter that environment gets an OIDC
  # token npm's registry flatly rejects — "npm error code E404... PUT
  # .../@peardrop%2fcore - Not found" on the very first real publish attempt
  # under the split (peardrop#41/#42's 1.5.0 release). Re-enabling
  # auto-publish for minor/patch needs Mohammed to add a second trusted
  # environment on npm's side first — filed as smashah/peardrop#43, not
  # re-attempted here blind.
  publish:
    if: needs.plan.outputs.mode == 'publish'
    needs: plan
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run boundary:check
      - run: pnpm run check-types
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run package:smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned relay image
        id: relay
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/relay/package.json').version")
          image=ghcr.io/smashah/peardrop-relay
          docker build -f infra/relay/Dockerfile -t "$image:$version" .
          docker push "$image:$version"
          digest_ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version")
          test -n "$digest_ref"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"
      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest
      - run: pnpm exec bumpy ci release --expect-mode publish
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Verify npm packages
        env:
          VERSION: ${{ steps.relay.outputs.version }}
        run: |
          set -euo pipefail
          verify_package() {
            package=$1
            for attempt in 1 2 3 4 5; do
              if published_version=$(npm view "$package@$VERSION" version 2>/dev/null) && [ "$published_version" = "$VERSION" ]; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep 3
              fi
            done
            echo "$package@$VERSION did not become visible after 5 attempts" >&2
            return 1
          }
          verify_package @peardrop/core
          verify_package @peardrop/cli
      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.relay.outputs.version }}
        run: gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -F -- "$VERSION"
      - name: Promote verified relay image
        env:
          DIGEST_REF: ${{ steps.relay.outputs.digest_ref }}
          IMAGE: ${{ steps.relay.outputs.image }}
          VERSION: ${{ steps.relay.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:latest" | grep -F -- "${DIGEST_REF#*@}"
          echo "Relay image: $DIGEST_REF" >> "$GITHUB_STEP_SUMMARY"
