name: release

on:
  push:
    branches: [main]

concurrency:
  group: bumpy-release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  plan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: pnpm exec bumpy ci plan

  version-pr:
    if: needs.plan.outputs.mode == 'version-pr'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

  publish:
    if: needs.plan.outputs.mode == 'publish'
    needs: plan
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run boundary:check
      - run: pnpm run check-types
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run package:smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish relay image
        run: |
          version=$(node -p "require('./apps/relay/package.json').version")
          docker build -f infra/relay/Dockerfile -t "ghcr.io/smashah/peardrop-relay:${version}" -t ghcr.io/smashah/peardrop-relay:latest .
          docker push "ghcr.io/smashah/peardrop-relay:${version}"
          docker push ghcr.io/smashah/peardrop-relay:latest
      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest
      - run: pnpm exec bumpy ci release --expect-mode publish
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
